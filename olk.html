<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ostlukoland – LSB-Netzkarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F5F6F9;
  --canvas:#FCFCFD;
  --surface:#FFFFFF;
  --ink:#131F4D;
  --ink-2:#465074;
  --ink-3:#77819E;
  --rule:#E3E6EE;
  --rule-2:#D2D8E5;
  --wash:#EBEEF6;
  --halo:rgba(255,255,255,.94);
  --shadow:0 1px 2px rgba(19,31,77,.06),0 8px 24px rgba(19,31,77,.09);
  --sidebar-w:388px;
  --sheet-h:136px;
  --f-ui:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font:400 15px/1.4 var(--f-ui);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);height:100%}

/* ───────── Seitenleiste ───────── */
.panel{
  background:var(--paper);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:4;
}
.sheet-handle{display:none}
.top{padding:22px 20px 14px;flex:none}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.badge{
  flex:none;width:46px;height:46px;border-radius:10px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font:700 22px/1 var(--f-cond);letter-spacing:.02em;
}
.brand h1{margin:0;font:600 32px/1 var(--f-cond);letter-spacing:-.005em}
.brand p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px;font-weight:500}

.search{position:relative}
.search input{
  width:100%;height:46px;border:1px solid var(--rule-2);border-radius:12px;background:var(--surface);
  padding:0 42px 0 42px;font:500 15.5px var(--f-ui);color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search input::placeholder{color:var(--ink-3);font-weight:400}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(19,31,77,.10)}
.search .ico{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search .clear{
  position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;background:none;border-radius:8px;
  display:none;place-items:center;color:var(--ink-3)
}
.search.has-q .clear{display:grid}
.search .clear:hover{background:var(--wash);color:var(--ink)}
.results{
  position:absolute;left:0;right:0;top:52px;z-index:10;margin:0;padding:6px;list-style:none;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:14px;box-shadow:var(--shadow);
  max-height:min(56vh,440px);overflow:auto;display:none;
}
.results.open{display:block}
.results li{margin:0}
.res{
  display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;text-align:left;
}
.res[aria-selected=true],.res:hover{background:var(--wash)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .t small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:500}
.res .mini{display:flex;gap:3px;flex:none}
.res .kind{flex:none;width:34px;display:grid;place-items:center}
.empty{padding:14px 12px;color:var(--ink-2);font-size:14px}

.body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 20px 28px}
.body h2.sec{
  display:flex;align-items:baseline;gap:8px;margin:20px 0 10px;
  font:600 19px/1 var(--f-cond);letter-spacing:.005em;
}
.body h2.sec span{font:500 14px var(--f-cond);color:var(--ink-3)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.chip{
  display:flex;flex-direction:column;gap:7px;padding:9px 10px 8px;text-align:left;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:9px;min-width:0;
  transition:border-color .12s,box-shadow .12s,transform .12s;
}
.chip:hover{border-color:var(--ink);box-shadow:0 2px 8px rgba(19,31,77,.10)}
.chip:active{transform:translateY(1px)}
.chip .sw{display:block;width:100%;height:10px}
.chip .zs{display:block;width:100%;height:10px;border-radius:3px;border:1px solid rgba(19,31,77,.10)}
.chip .n{font:600 16px/1 var(--f-cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .n i{font-style:normal;color:var(--ink-3);font-weight:500;margin-left:5px;font-size:13px}
.note-foot{margin:26px 0 0;color:var(--ink-3);font-size:13px}

/* ───────── Detailansicht ───────── */
.back{
  display:inline-flex;align-items:center;gap:6px;margin:10px 0 4px -8px;padding:6px 10px 6px 6px;border:0;background:none;
  border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14px
}
.back:hover{background:var(--wash);color:var(--ink)}
.back svg{width:18px;height:18px}
.d-title{margin:6px 0 10px;font:600 36px/1.02 var(--f-cond);letter-spacing:-.005em;text-wrap:balance}
.d-sub{margin:0 0 14px;color:var(--ink-2);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;border-radius:6px;background:var(--wash);
  color:var(--ink-2);font-size:13px;font-weight:500
}
.tag svg{width:15px;height:13px;fill:currentColor;flex:none}
.tag .zd{width:10px;height:10px;border-radius:3px;border:1px solid rgba(19,31,77,.16)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--ink);border-radius:9px;background:var(--surface);
  font-weight:600;font-size:14px;color:var(--ink);transition:background .12s,color .12s
}
.btn:hover{background:var(--ink);color:#fff}
.btn svg{width:16px;height:16px}
.d-actions{display:flex;gap:8px;margin:0 0 6px}
.d-head{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.d-head .bigsw{flex:none;width:58px;height:58px;border-radius:10px;background:var(--surface);border:1px solid var(--rule-2);display:grid;place-items:center}
.d-head .bigsw span{display:block;width:32px;height:8px}
.d-head .d-title{margin:0}
.d-head small{display:block;margin-top:4px;color:var(--ink-3);font-size:13.5px;font-weight:500}
h3.sub{
  display:flex;align-items:baseline;gap:8px;margin:24px 0 6px;font:600 18px/1 var(--f-cond);
  padding-top:16px;border-top:1px solid var(--rule)
}
h3.sub span{font:500 14px var(--f-cond);color:var(--ink-3)}

.lrows{list-style:none;margin:0;padding:0}
.lrows>li{padding:10px 0 12px;border-bottom:1px solid var(--rule)}
.lrows>li:last-child{border-bottom:0}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:4px 6px 4px 0;border:0;background:none;text-align:left;border-radius:8px}
.lrow:hover{background:var(--wash)}
.lrow .sw{flex:none;display:block;width:46px;height:10px}
.lrow b{font:600 21px/1 var(--f-cond)}
.lrow small{color:var(--ink-3);font-size:13px;font-weight:500}
.nbrs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0 58px}
.nbrs>span{color:var(--ink-3);font-size:13px;font-weight:500}
.nb{
  padding:4px 9px;border:1px solid var(--rule-2);border-radius:7px;background:var(--surface);font-size:13.5px;font-weight:500
}
.nb:hover{border-color:var(--ink);background:var(--wash)}

.route{list-style:none;margin:0;padding:0}
.route li{position:relative}
.route .bh{margin:14px 0 2px 34px;padding-top:12px;border-top:1px dashed var(--rule-2);color:var(--ink-2);font-size:13.5px;font-weight:500}
.route .loopnote{margin:2px 0 0 34px;color:var(--ink-3);font-size:13px}
.stop{
  display:flex;align-items:center;gap:12px;width:100%;padding:0 8px 0 0;border:0;background:none;text-align:left;border-radius:8px;min-height:38px
}
.stop:hover,.stop.cur{background:var(--wash)}
.stop .rail{position:relative;flex:none;align-self:stretch;width:22px}
.stop .rail::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;
  background:var(--rail-bg);background-repeat:no-repeat;
}
.route li:first-child .stop .rail::before,.route .bh+li .stop .rail::before{top:50%}
.route li:last-child .stop .rail::before,.route li:has(+ .bh) .stop .rail::before{bottom:50%}
.stop .rail::after{
  content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:#fff;border:3px solid var(--ink)
}
.stop .nm{flex:1;min-width:0;font-weight:500;font-size:15px;padding:6px 0}
.stop .xf{display:flex;gap:3px;flex:none}
.xf i{display:block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(19,31,77,.14)}
.xf em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:2px;align-self:center}

.slist{list-style:none;margin:0;padding:0}
.slist .stop .rail{display:none}
.slist .stop{padding-left:8px}

/* ───────── Karte ───────── */
.stage{position:relative;overflow:hidden;background:var(--canvas);touch-action:none;min-width:0;outline:none}
.stage:focus-visible{outline:2px solid var(--ink);outline-offset:-3px;border-radius:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.dragging #map{cursor:grabbing}
.ctrl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:3}
.ctrl button{
  width:42px;height:42px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:11px;box-shadow:var(--shadow);color:var(--ink);transition:background .12s
}
.ctrl button:hover{background:var(--wash)}
.ctrl svg{width:20px;height:20px}
.ctrl .zoom{display:flex;flex-direction:column;border-radius:11px;box-shadow:var(--shadow);background:var(--surface);border:1px solid var(--rule-2)}
.ctrl .zoom button{box-shadow:none;border:0;border-radius:0}
.ctrl .zoom button:first-child{border-radius:10px 10px 0 0;border-bottom:1px solid var(--rule)}
.ctrl .zoom button:last-child{border-radius:0 0 10px 10px}
.hint{
  position:absolute;left:16px;bottom:16px;z-index:3;padding:8px 13px;border-radius:10px;background:var(--surface);
  border:1px solid var(--rule-2);box-shadow:var(--shadow);font-size:13.5px;color:var(--ink-2);font-weight:500;
  transition:opacity .5s,transform .5s;pointer-events:none
}
.hint.gone{opacity:0;transform:translateY(6px)}
.tip{
  position:absolute;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--rule-2);border-radius:11px;
  box-shadow:var(--shadow);padding:9px 12px 10px;max-width:260px;opacity:0;transition:opacity .1s
}
.tip.on{opacity:1}
.tip b{display:block;font:600 18px/1.1 var(--f-cond)}
.tip small{display:block;margin-top:3px;color:var(--ink-3);font-size:12.5px;font-weight:500}
.tip .tl{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:8px}
.tip .tl span{display:inline-flex;align-items:center;gap:5px;font:600 14px/1 var(--f-cond)}
.tip .tl .sw{width:20px;height:7px}
.tip .one{display:flex;align-items:center;gap:9px}
.tip .one .sw{width:34px;height:9px;flex:none}

/* SVG-Elemente */
#map text{font-family:var(--f-cond);text-rendering:geometricPrecision}
.a-f{stroke-width:.3;stroke-linejoin:round;fill-rule:evenodd}
.a-b{stroke-width:.4;stroke-linejoin:round;fill-rule:evenodd}
.a-f{fill:var(--zf);stroke:var(--zf)}
.a-b{fill:var(--zb);stroke:var(--zb)}
.area{transition:opacity .25s}
.al{font-weight:700;font-size:1px;letter-spacing:.14em;fill:var(--zl);dominant-baseline:central;text-anchor:middle;pointer-events:none}
.als{transform:scale(var(--sa,1))}
#sigareas,#sigalabels{display:none}
svg.zk-signal #areas,svg.zk-signal #alabels{display:none}
svg.zk-signal #sigareas,svg.zk-signal #sigalabels{display:block}
#tmds,#css{display:none}
svg.show-tmd #tmds{display:block}
svg.show-cs #css{display:block}
.tmd-m{fill:var(--surface);stroke:var(--ink);stroke-width:.1}
.tmd-x{stroke:var(--ink);stroke-width:.08}
.tmd-l{font-weight:600;font-size:.4px;fill:var(--ink);paint-order:stroke fill;stroke:var(--halo);stroke-width:.14px;stroke-linejoin:round}
.tmd:hover .tmd-m,.csm:hover .cs-m{fill:var(--wash)}
.cs-m{fill:var(--surface);stroke:hsl(258,42%,45%);stroke-width:.1}
.cs-b{stroke:hsl(258,42%,45%);stroke-width:.07}
.cs-l{font-weight:600;font-size:.4px;fill:hsl(258,42%,38%);paint-order:stroke fill;stroke:var(--halo);stroke-width:.14px;stroke-linejoin:round}
.bar path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.seg path{fill:none;stroke-linejoin:round}
.seg .hit{stroke:transparent;stroke-width:var(--hitw,.5px);stroke-dasharray:none;pointer-events:stroke;cursor:pointer}
.seg{transition:opacity .22s}
.seg.dim{opacity:.12}
.hlc{stroke:#fff;stroke-width:.5;stroke-linecap:round;opacity:.96}
#hl .seg{pointer-events:none}
.st{transition:opacity .22s}
.st.dim{opacity:.16}
.st .hit{fill:transparent;r:var(--hitr,.8px);cursor:pointer;pointer-events:all}
.sy-e{fill:#fff;stroke:var(--ink);stroke-width:.16}
.tk-o{stroke:var(--ink);stroke-width:.3;stroke-linecap:round;fill:none}
.tk-c{stroke-width:.15;stroke-linecap:butt;fill:none}
.st.sel .sy-e{stroke-width:.22}
.lb{opacity:0;transition:opacity .2s;pointer-events:none}
.l0 .lb.t0,.l1 .lb.t1,.l2 .lb.t2,.l3 .lb.t3{opacity:1}
.lb.dim{opacity:0!important}
.lb.force{opacity:1!important}
.lbs{transform:scale(var(--s,1))}
.lb text{
  font-weight:600;font-size:.4px;fill:var(--ink);
  paint-order:stroke fill;stroke:var(--halo);stroke-width:.16px;stroke-linejoin:round
}
.lb use{fill:var(--ink);stroke:var(--halo);stroke-width:0;paint-order:stroke}
#notes{pointer-events:none}
.arr{stroke:var(--ink);stroke-width:.3;fill:none;stroke-linecap:butt}
.arh{fill:var(--ink)}
#ring{pointer-events:none}
#ring circle{fill:none;vector-effect:non-scaling-stroke}
#ring .rb{stroke:#fff;stroke-width:7px}
#ring .rf{stroke:var(--ink);stroke-width:2.6px}
#ring.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:scale(1)}}
#ring{transform-box:fill-box}

/* Einblenden beim Laden: eine choreografierte Sequenz */
@media (prefers-reduced-motion:no-preference){
  .intro #areas{animation:fin .7s ease both}
  .intro #segs{animation:fin .8s .25s ease both}
  .intro #stations,.intro #notes{animation:fin .6s .7s ease both}
  .intro #labels,.intro #alabels{animation:fin .6s .95s ease both}
  @keyframes fin{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ───────── Mobil: Bottom-Sheet ───────── */
@media (max-width:859px){
  .app{display:block;position:relative}
  .stage{position:absolute;inset:0}
  .panel{
    position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);border-right:0;border-radius:18px 18px 0 0;
    border-top:1px solid var(--rule);box-shadow:0 -8px 30px rgba(19,31,77,.12);transition:height .3s cubic-bezier(.3,.8,.3,1);
    padding-bottom:env(safe-area-inset-bottom,0px)
  }
  .panel[data-sheet=open]{height:min(56vh,520px)}
  .sheet-handle{display:block;flex:none;width:100%;height:22px;border:0;background:none;position:relative}
  .sheet-handle::after{content:"";position:absolute;left:50%;top:9px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--rule-2)}
  .top{padding:0 16px 10px}
  .brand{display:none}
  .body{padding:0 16px 24px}
  .ctrl{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto;right:12px}
  .hint{display:none}
  .chips{grid-template-columns:repeat(3,minmax(0,1fr))}
  .d-title{font-size:32px}
}
@media (max-width:859px) and (min-width:560px){
  .chips{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:860px) and (max-width:1100px){:root{--sidebar-w:340px}}

/* ───────── Anzeigeoptionen (Zonen / Beschriftung) ───────── */
.modes{display:flex;gap:8px;margin-top:10px}
.seg{flex:1;display:flex;background:var(--wash);border-radius:9px;padding:3px;gap:2px}
.seg button{
  flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font:600 13px var(--f-ui);color:var(--ink-2);
  transition:background .12s,color .12s;white-space:nowrap
}
.seg button i{font-style:normal;opacity:.6;margin-left:1px}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(19,31,77,.14)}
.seg button:hover:not([aria-checked=true]){color:var(--ink)}
.chk{
  display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--rule-2);
  border-radius:9px;background:var(--surface);color:var(--ink-2);font:600 13px var(--f-ui)
}
.chk svg{width:17px;height:17px;flex:none}
.chk[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk:hover:not([aria-pressed=true]){border-color:var(--ink);color:var(--ink)}

/* ───────── Steckbrief (Infosheet) ───────── */
.info-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.info-grid>div{padding:8px 0;border-bottom:1px solid var(--rule)}
.info-grid dt{margin:0;color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.info-grid dd{margin:2px 0 0;font-weight:500;font-size:14.5px}
.info-grid dd.na{color:var(--ink-3);font-weight:400}
.kbadge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;background:var(--wash);color:var(--ink-2);font:600 13px var(--f-cond);letter-spacing:.03em;margin-left:8px;vertical-align:1px}
@media (max-width:420px){.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" data-sheet="peek" aria-label="Netzübersicht">
    <button class="sheet-handle" id="handle" aria-label="Seitenleiste ein- oder ausklappen"></button>
    <div class="top">
      <div class="brand">
        <div class="badge" aria-hidden="true">LSB</div>
        <div><h1>Ostlukoland</h1><p id="brandSub">Netzkarte</p></div>
      </div>
      <div class="search" id="searchBox">
        <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.7 12.7 17 17"/></svg>
        <input id="q" type="text" placeholder="Halt, Linie, Kürzel oder Zone suchen" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Halt, Linie, Kürzel oder Zone suchen">
        <button class="clear" id="qClear" aria-label="Suche leeren"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        <ul class="results" id="results" role="listbox" aria-label="Suchergebnisse"></ul>
      </div>
      <div class="modes" role="group" aria-label="Anzeigeoptionen">
        <div class="seg" role="radiogroup" aria-label="Zonen">
          <button role="radio" aria-checked="true" data-zk="region">Region<i>*</i></button>
          <button role="radio" aria-checked="false" data-zk="signal">Signal</button>

let W=0,H=0;

let bounds=null,kMin=2,kMax=90,animId=0;

function pads(){

function viewForBounds(b,pd=pads(),maxK=kMax){

function viewForPoint(wx,wy,k,pd=pads()){

let pending=false;
function schedule(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;apply()})}}
let lodKey='';
function apply(){
  world.setAttribute('transform',`matrix(${view.k} 0 0 ${view.k} ${view.x} ${view.y})`);
  const k=view.k;
  const s=clamp(9/(.4*k),1,3.4).toFixed(3);

function stopAnim(){animId++}
function goTo(v,ms=600){
  stopAnim();
  v={k:clamp(v.k,kMin,kMax),x:v.x,y:v.y};
  if(reduce||ms<=0||!W){Object.assign(view,v);apply();return}
  const id=animId,t0=performance.now(),fx=W/2,fy=H/2;
  const k0=view.k,c0x=(fx-view.x)/k0,c0y=(fy-view.y)/k0;
  const c1x=(fx-v.x)/v.k,c1y=(fy-v.y)/v.k;

    if(id!==animId)return;
    const t=clamp((now-t0)/ms,0,1),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const k=k0*Math.pow(v.k/k0,e),cx=c0x+(c1x-c0x)*e,cy=c0y+(c1y-c0y)*e;

/* ───────── Zeiger-Interaktion ───────── */
const pointers=new Map();
let drag=null,pinch=null,moved=false,suppress=false;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ctrl,.hint'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  stopAnim();hideHint();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){drag={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};moved=false}
  else if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};drag=null;moved=true;
  }
});
stage.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)){
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pointers.size>=2){
      const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      const r=stage.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;
      zoomAt(cx,cy,clamp(pinch.k*d/pinch.d,kMin,kMax)/view.k);
      return;
    }
    if(drag){
      const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
      if(!moved&&Math.hypot(dx,dy)>5){moved=true;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');hideTip()}

function stationHTML(id){
  const s=S[id],alt=altName(s);
  const tags=[...s.icons.map(k=>`<span class="tag">${tagIcon(k)}${ICON_LABEL[k]}</span>`),
    s.note?`<span class="tag">${esc(s.note)}</span>`:'',
    ...zoneCodes(zoneKind,s).map(z=>`<span class="tag"><span class="zd" style="background:${zoneMeta(zoneKind,z).c.f}"></span>${zoneLabel(zoneKind)} ${esc(NO_SIG(z)&&zoneKind==='signal'?'–':z)}</span>`)].join('');
  const rows=s.lines.map(li=>{
    const l=L[li],nb=[...(adj[li].get(id)||[])].sort((a,b)=>collator.compare(S[a].name,S[b].name));
    return `<li><button class="lrow" data-line="${li}">${swatchSVG(l,'sw','0 .3 4.6 .4')}<b>${esc(l.short)}</b>${l.note?`<small>${esc(l.note)}</small>`:''}</button>
      ${nb.length?`<div class="nbrs"><span>${nb.length>1?'Nachbarhalte':'Nachbarhalt'}</span>${nb.map(n=>`<button class="nb" data-st="${n}">${esc(dispName(S[n]))}</button>`).join('')}</div>`:''}</li>`;
  }).join('');
  return `${backBtn()}<h2 class="d-title">${esc(dispName(s))}${alt?`<span class="kbadge">${esc(alt)}</span>`:''}</h2>${tags?`<div class="tags">${tags}</div>`:''}
  <div class="d-actions"><button class="btn" data-act="center">${IC.pin}Auf Karte zeigen</button></div>
  <h3 class="sub">Steckbrief</h3><div class="info-grid">${infoRows(s)}</div>
  <h3 class="sub">Linien an diesem Halt <span>${s.lines.length}</span></h3><ul class="lrows">${rows}</ul>`;
}
function lineHTML(li,curSt){
  const l=L[li],r=l.route,n=stopsOf[li].length;
  const first=S[r.main[0]].name,last=S[r.main[r.main.length-1]].name;
  const sub=r.ring?`Ringlinie mit ${n} Halten`:`${n} Halte, zwischen ${esc(first)} und ${esc(last)}${r.branches.length?', mit Abzweigen':''}`;
  let items=r.main.map(id=>`<li>${stopBtn(id,li,curSt)}</li>`).join('');
  if(r.ring)items+=`<li class="loopnote">weiter zu ${esc(first)}</li>`;
  r.branches.forEach(b=>{
    items+=`<li class="bh">Abzweig ab ${esc(S[b.from].name)}</li>`+b.stops.map(id=>`<li>${stopBtn(id,li,curSt)}</li>`).join('');
  });
  return `${backBtn()}
  <div class="d-head"><span class="bigsw">${swatchSVG(l,'','0 .3 3.2 .4').replace('<svg class=""','<svg style="width:36px;height:9px"')}</span>
    <div><h2 class="d-title">${esc(l.short)}</h2>${l.note?`<small>${esc(l.note)}</small>`:''}</div></div>
  <p class="d-sub" style="margin-top:12px">${sub}</p>
  <div class="d-actions"><button class="btn" data-act="fit">${IC.fit}Linie einpassen</button></div>
  <h3 class="sub">Linienverlauf <span>${n}</span></h3>
  <ol class="route" style="--rail-bg:${railBg(l)}">${items}</ol>`;
}
function zoneHTML(kind,id){
  const meta=zoneMeta(kind,id),ids=[...zoneMembers(kind,id)].sort((x,y)=>collator.compare(S[x].name,S[y].name));
  return `${backBtn()}<div class="d-head"><span class="bigsw"><span style="width:34px;height:34px;border-radius:7px;background:${meta.c.f};border:1px solid ${meta.c.b}"></span></span>
    <div><h2 class="d-title">${zoneLabel(kind)} ${esc(meta.label)}</h2><small>${ids.length} Halte</small></div></div>
  <div class="d-actions" style="margin-top:12px"><button class="btn" data-act="fit">${IC.fit}${zoneLabel(kind)} einpassen</button></div>
  <h3 class="sub">Halte ${kind==='signal'?'in dieser Zone':'im Bezirk'} <span>${ids.length}</span></h3>
  <ul class="slist">${ids.map(i=>`<li>${stopBtn(i,-1,-1)}</li>`).join('')}</ul>`;
}
function render(){
  const st=body.scrollTop;
  if(cur.t==='home')body.innerHTML=homeHTML();
  else if(cur.t==='station')body.innerHTML=stationHTML(cur.id);
  else if(cur.t==='line'){
    const from=nav.length>1&&nav[nav.length-2].t==='station'?nav[nav.length-2].id:-1;
    body.innerHTML=lineHTML(cur.id,from);
  }else body.innerHTML=zoneHTML(cur.kind,cur.id);
  body.scrollTop=0;
  if(cur.t==='line'){const c=$('.stop.cur',body);if(c)c.scrollIntoView({block:'center'})}
}
body.addEventListener('click',e=>{
  const t=e.target.closest('[data-line],[data-st],[data-zone],[data-act]');
  if(!t)return;
  if(t.dataset.act==='back')return back();
  if(t.dataset.act==='center'&&cur.t==='station'){const s=S[cur.id];goTo(viewForPoint(s.x,s.y,Math.max(view.k,28)),600);return}
  if(t.dataset.act==='fit'){
    if(cur.t==='line'){const b=lineBox[cur.id];goTo(viewForBounds([b[0]-2,b[1]-2,b[2]+2,b[3]+2]),650)}
    else if(cur.t==='zone'){const b=zoneBBox(cur.kind,cur.id);goTo(viewForBounds([b[0]-1,b[1]-1,b[2]+1,b[3]+1]),650)}
    return;
  }
  if(t.dataset.line!=null)return open({t:'line',id:+t.dataset.line});
  if(t.dataset.st!=null)return open({t:'station',id:+t.dataset.st});
  if(t.dataset.zone!=null)return open({t:'zone',kind:zoneKind,id:t.dataset.zone});
});
$('#handle').onclick=()=>{panel.dataset.sheet=panel.dataset.sheet==='open'?'peek':'open'};

/* ───────── Umschalter: Zonen / Beschriftung ───────── */
function syncModeUI(){
  $$('.seg [data-zk]').forEach(b=>b.setAttribute('aria-checked',b.dataset.zk===zoneKind));
  $$('.seg [data-nm]').forEach(b=>b.setAttribute('aria-checked',b.dataset.nm===nameMode));
}
$$('.seg [data-zk]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.zk===zoneKind)return;
  zoneKind=b.dataset.zk;
  svg.classList.toggle('zk-signal',zoneKind==='signal');
  if(cur.t==='zone')open({t:'home'});else render();
  syncModeUI();
}));
$$('.seg [data-nm]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.nm===nameMode)return;
  nameMode=b.dataset.nm;
  buildLabels();render();focusMap(false);
  syncModeUI();
}));
$('#tmdBtn').addEventListener('click',()=>{
  const on=$('#tmdBtn').getAttribute('aria-pressed')!=='true';
  $('#tmdBtn').setAttribute('aria-pressed',on);
  svg.classList.toggle('show-tmd',on);
});
$('#csBtn').addEventListener('click',()=>{
  const on=$('#csBtn').getAttribute('aria-pressed')!=='true';
  $('#csBtn').setAttribute('aria-pressed',on);
  svg.classList.toggle('show-cs',on);
});

/* ───────── Karte anklicken ───────── */
stage.addEventListener('click',e=>{
  if(suppress)return;
  const t=e.target.closest('.st,.seg');
  hideHint();
  if(!t){return}
  if(t.classList.contains('st'))open({t:'station',id:+t.dataset.id});
  else open({t:'line',id:G[+t.dataset.i].l});
});

/* ───────── Suche ───────── */
const qi=$('#q'),resEl=$('#results'),box=$('#searchBox');
let results=[],active=-1;
function runSearch(raw){
  const q=fold(raw.trim());
  if(!q)return[];
  const out=[];
  L.forEach((l,i)=>{const n=fold(l.short+' '+l.note);const sc=n.startsWith(q)?0:n.split(/[\s-]+/).some(w=>w.startsWith(q))?1:n.includes(q)?3:-1;if(sc>=0)out.push({t:'line',id:i,sc:sc-.5,name:l.short})});
  zoneList(zoneKind).forEach(z=>{const n=fold(z.label);if(n.startsWith(q))out.push({t:'zone',kind:zoneKind,id:z.id,sc:0,name:`${zoneLabel(zoneKind)} ${z.label}`})});
  S.forEach(s=>{
    const n=s.norm,k=fold(s.info.kuerzel||'');let sc=-1;
    if(n.startsWith(q)||k===q)sc=0;else if(n.split(/[\s\-(]+/).some(w=>w.startsWith(q)))sc=1;else if(n.includes(q))sc=3;
    if(sc>=0)out.push({t:'station',id:s.id,sc,name:s.name});
  });
  out.sort((a,b)=>a.sc-b.sc||collator.compare(a.name,b.name));
  return out.slice(0,9);
}
function resHTML(r,i){
  let kind,name,sub,mini='';
  if(r.t==='line'){const l=L[r.id];kind=swatchSVG(l,'sw','0 .3 1.8 .4').replace('<svg class="sw"','<svg style="width:32px;height:9px"');name=l.short;sub=`Linie${l.note?', '+l.note:''}, ${stopsOf[r.id].length} Halte`}
  else if(r.t==='zone'){const m=zoneMeta(r.kind,r.id);kind=`<span style="width:22px;height:22px;border-radius:6px;background:${m.c.f};border:1px solid ${m.c.b}"></span>`;name=r.name;sub=`${zoneMembers(r.kind,r.id).length} Halte`}
  else{const s=S[r.id];kind=`<span style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--ink)"></span>`;name=dispName(s);
    sub=[s.icons.map(k=>ICON_LABEL[k]).join(', '),zoneText(zoneKind,s),s.note].filter(Boolean).join(', ')||'Halt';
    mini=s.lines.slice(0,5).map(i=>swatchMini(L[i]).replace('<i ','<i style="width:11px;height:11px;border-radius:3px;display:block;" data-x ')).join('');}
  return `<li role="presentation"><button class="res" role="option" id="res-${i}" aria-selected="${i===active}" data-i="${i}"><span class="kind">${kind}</span><span class="t"><b>${esc(name)}</b><small>${esc(sub)}</small></span><span class="mini">${mini}</span></button></li>`;
}
function showResults(){
  const v=qi.value;box.classList.toggle('has-q',!!v);
  if(!v.trim()){closeResults();return}
  results=runSearch(v);active=results.length?0:-1;
  resEl.innerHTML=results.length?results.map(resHTML).join(''):`<li class="empty">Kein Treffer für „${esc(v.trim())}“. Prüfe die Schreibweise, zum Beispiel „Güntringen“.</li>`;
  resEl.classList.add('open');qi.setAttribute('aria-expanded','true');
  if(active>=0)qi.setAttribute('aria-activedescendant','res-0');
  if(mobileMQ.matches)panel.dataset.sheet='open';
}
function closeResults(){resEl.classList.remove('open');qi.setAttribute('aria-expanded','false');qi.removeAttribute('aria-activedescendant');results=[];active=-1}
function pick(i){
  const r=results[i];if(!r)return;
  qi.value='';box.classList.remove('has-q');closeResults();qi.blur();
  open(r.t==='zone'?{t:'zone',kind:r.kind,id:r.id}:{t:r.t,id:r.id});
}
function setActive(n){
  active=(n+results.length)%results.length;
  $$('.res',resEl).forEach((b,i)=>b.setAttribute('aria-selected',i===active));
  const b=$('#res-'+active);b.scrollIntoView({block:'nearest'});qi.setAttribute('aria-activedescendant','res-'+active);
}
qi.addEventListener('input',showResults);
qi.addEventListener('focus',()=>{if(qi.value.trim())showResults();else if(mobileMQ.matches)panel.dataset.sheet='open'});
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'&&results.length){e.preventDefault();setActive(active+1)}
  else if(e.key==='ArrowUp'&&results.length){e.preventDefault();setActive(active-1)}
  else if(e.key==='Enter'&&active>=0){e.preventDefault();pick(active)}
  else if(e.key==='Escape'){if(qi.value){qi.value='';showResults()}else{closeResults();qi.blur()}}
});
resEl.addEventListener('mousedown',e=>e.preventDefault());
resEl.addEventListener('click',e=>{const b=e.target.closest('.res');if(b)pick(+b.dataset.i)});
$('#qClear').onclick=()=>{qi.value='';showResults();qi.focus()};
document.addEventListener('click',e=>{if(!box.contains(e.target))closeResults()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qi&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();qi.focus()}
  else if(e.key==='Escape'&&document.activeElement!==qi&&document.activeElement!==stage){back(true)}
});

/* ───────── Hash ───────── */
function sync(){
  try{
    let h='';
    if(cur.t==='line')h=`#l=${encodeURIComponent(cur.id)}`;
    else if(cur.t==='station')h=`#s=${encodeURIComponent(cur.id)}`;
    else if(cur.t==='zone')h=`#z=${cur.kind[0]}:${encodeURIComponent(cur.id)}`;
    history.replaceState(null,'',location.pathname+location.search+h);
  }catch(_){}
}
function fromHash(){
  try{
    const m=location.hash.match(/^#([lsz])=(.+)$/);if(!m)return null;
    const v=decodeURIComponent(m[2]);
    if(m[1]==='l'){const i=+v;return L[i]?{t:'line',id:i}:null}
    if(m[1]==='s'){const i=+v;return S[i]?{t:'station',id:i}:null}
    const km=v.match(/^([rs]):(.+)$/);if(!km)return null;
    const kind=km[1]==='s'?'signal':'region';
    return zoneMembers(kind,km[2])?{t:'zone',kind,id:km[2]}:null;
  }catch(_){return null}
}

/* ───────── Start ───────── */
$('#brandSub').textContent=`LSB-Netzkarte, ${L.length} Linien und ${S.length} Halte`;
svg.setAttribute('aria-label',`Netzkarte von Ostlukoland mit ${L.length} Linien und ${S.length} Halten`);
function init(){
  measure();
  const bb=world.getBBox();
  bounds=[bb.x,bb.y,bb.x+bb.width,bb.y+bb.height];
  const pd=pads();
  kMin=Math.min(W/(bb.width+pd.l+pd.r),H/(bb.height+pd.t+pd.b))*.55;
  Object.assign(view,viewForBounds(bounds,pd));
  apply();
  render();
  const h=fromHash();
  if(h){setTimeout(()=>open(h),350)}
  requestAnimationFrame(()=>setTimeout(()=>world.classList.remove('intro'),2200));
}
new ResizeObserver(()=>{
  if(!W){return}
  const cx=(W/2-view.x)/view.k,cy=(H/2-view.y)/view.k;
  measure();view.x=W/2-cx*view.k;view.y=H/2-cy*view.k;schedule();
}).observe(stage);
mobileMQ.addEventListener&&mobileMQ.addEventListener('change',()=>{measure();fitAll(0)});
init();
window.__map={view,goTo,open,fitAll};
})();
</script>
